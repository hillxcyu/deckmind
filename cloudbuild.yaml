options:
  logging: 'CLOUD_LOGGING_ONLY'
steps:
  # 1. Build the image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', '$_IMAGE', '.']

  # 2. Push the image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '$_IMAGE']

  # 3. Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'deckmind-app'
      - '--image'
      - '$_IMAGE'
      - '--add-cloudsql-instances'
      - '$_INSTANCE_CONNECTION'
      - '--update-env-vars'
      - 'DATABASE_URL=$_DB_URL,JWT_SECRET=$_JWT_SECRET,GOOGLE_CLOUD_PROJECT=$_PROJECT_ID,GOOGLE_CLOUD_LOCATION=$_MODEL_LOCATION,GEMINI_MAIN_MODEL=$_MAIN_MODEL,GEMINI_FLASH_MODEL=$_FLASH_MODEL,GEMINI_IMAGE_MODEL=$_IMAGE_MODEL'
      - '--platform'
      - 'managed'
      - '--region'
      - '$_REGION'
      - '--allow-unauthenticated'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '1'

images:
  - '$_IMAGE'

substitutions:
  _IMAGE: 'YOUR_REGION-docker.pkg.dev/YOUR_PROJECT_ID/deckmind-repo/deckmind-app:latest'
  _INSTANCE_CONNECTION: 'YOUR_PROJECT_ID:YOUR_REGION:deckmind-db'
  _DB_URL: 'postgresql://postgres:YOUR_DB_PASSWORD@/deckmind?host=/cloudsql/YOUR_PROJECT_ID:YOUR_REGION:deckmind-db'
  _JWT_SECRET: 'YOUR_JWT_SECRET'
  _PROJECT_ID: 'YOUR_PROJECT_ID'
  _REGION: 'YOUR_REGION'
  _MODEL_LOCATION: 'global'
  _MAIN_MODEL: 'gemini-3.7-flash'
  _FLASH_MODEL: 'gemini-3.7-flash'
  _IMAGE_MODEL: 'gemini-3.1-flash-image-preview'
